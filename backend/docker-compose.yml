# Local dev infrastructure. Ports bound to loopback only.
# Postgres ships with pgvector; Azurite emulates Blob Storage.
# Redis is NOT here: use your host Redis on :6379 (REDIS_URL=redis://localhost:6379).
# If you don't have one: `brew install redis && brew services start redis`.
services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: frameseek
      POSTGRES_USER: frameseek
      POSTGRES_PASSWORD: frameseek_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frameseek"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Blob Storage emulator. Create containers once after it starts (see DEPLOY.md).
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck"
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - azurite_data:/data

volumes:
  postgres_data:
  azurite_data:
