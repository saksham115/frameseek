# The visitor's address, for the API's regional availability gate and the admin
# dashboard's geography. The ingress in front of us appends the address it accepted the
# connection from to X-Forwarded-For, so the right-most entry is the real visitor and
# anything a client sent itself sits to the left of it. We pass that one address on, because
# proxying to the API adds hops of our own that would otherwise look like the visitor.
map $http_x_forwarded_for $visitor_addr {
    "~,?\s*(?<last_addr>[^,\s]+)$" $last_addr;
    default                        $remote_addr;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/plain text/xml text/css application/javascript application/json application/manifest+json;

    # Same-origin API preserves first-party OAuth cookies. The nginx entrypoint
    # substitutes API_UPSTREAM from the Container App environment.
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Always set, so a visitor cannot send their own. The API's ingress is internal,
        # so this is the only way a request can arrive and the header can be trusted.
        proxy_set_header X-Client-IP $visitor_addr;
        proxy_ssl_server_name on;
        proxy_buffering off;
        proxy_read_timeout 240s;
    }

    location = /health {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
    }

    # Revalidate the app shell so returning users load the current hashed bundle.
    location = /index.html {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    }

    # Prerendered public pages (/terms -> terms.html) first, then the SPA fallback.
    # HTML is revalidated so a deploy is picked up immediately.
    location / {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        try_files $uri $uri.html /index.html;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    # Long-cache hashed assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
