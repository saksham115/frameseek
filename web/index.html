<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Static page text in #prerender is for crawlers that don't run JavaScript.
      // With JavaScript the app renders the same page, so hide it before first paint.
      document.documentElement.classList.add("js");
    </script>
    <style>
      .js #prerender { display: none; }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141915" />
    <meta name="application-name" content="FrameSeek" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=JetBrains+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <!-- seo:start (rewritten per page by the prerender step in vite.config.ts) -->
    <title>FrameSeek | AI video search: find any moment in your videos</title>
    <meta
      name="description"
      content="FrameSeek is AI video search. Upload your videos, describe a moment in plain words, and jump straight to it. Browse shots, read transcripts and export clips."
    />
    <link rel="canonical" href="https://app.frameseek.in/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FrameSeek" />
    <meta property="og:title" content="FrameSeek | AI video search: find any moment in your videos" />
    <meta
      property="og:description"
      content="Upload your videos, describe a moment in plain words, and jump straight to it. Browse shots, read transcripts and export clips."
    />
    <meta property="og:url" content="https://app.frameseek.in/" />
    <!-- seo:end -->
    <meta property="og:image" content="https://app.frameseek.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FrameSeek: find any moment in your videos. Just describe it." />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://app.frameseek.in/og-image.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://frameseek.in/#organization",
            "name": "FrameSeek",
            "url": "https://frameseek.in/",
            "logo": "https://app.frameseek.in/icon-512.png"
          },
          {
            "@type": "WebApplication",
            "@id": "https://app.frameseek.in/#app",
            "name": "FrameSeek",
            "url": "https://app.frameseek.in/",
            "description": "AI video search. Upload videos, describe a moment in plain words, and jump straight to it. Browse shots of similar frames, read transcripts and export clips as MP4.",
            "applicationCategory": "MultimediaApplication",
            "operatingSystem": "Web browser",
            "browserRequirements": "Requires JavaScript and a modern browser.",
            "image": "https://app.frameseek.in/og-image.png",
            "publisher": { "@id": "https://frameseek.in/#organization" },
            "featureList": [
              "Natural-language search across the frames of your videos",
              "Shots: similar-looking frames grouped for faster browsing and clipping",
              "Audio transcripts with find-in-transcript",
              "Clip export to MP4",
              "Folders to organise your library",
              "Private library per account"
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="prerender"></div>
    <div id="root"></div>
    <script>
      // Reuse the same theme key as the marketing site so the choice carries across.
      (function () {
        var t = localStorage.getItem("frameseek-theme") || "dark";
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.classList.toggle("dark", t === "dark");
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
