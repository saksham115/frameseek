<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <title>FrameSeek — Find any moment</title>
    <meta name="description" content="AI-powered video search. Find any moment in your videos by describing it." />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Reuse the same theme key as the marketing site so the choice carries across.
      (function () {
        var t = localStorage.getItem('frameseek-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
